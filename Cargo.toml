[package]
name = "axum-x402"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy = { version = "1.7", default-features = false, features = [
  "provider-http", "network", "reqwest", "reqwest-rustls-tls", "rpc-types", "consensus", "eips"
] }
x402-chain-eip155 = { version = "1.4.3", features = ["server"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.50.0", features = ["full"] }
alloy-primitives = "1.5.7"
serde_json = "1.0.149"
x402-types = "1.4.3"
x402-axum = "1.4.3"
dotenvy = "0.15.7"
thiserror = "2.0"
eyre = "0.6.12"
axum = "0.8.8"
http = "1.4.0"
alloy-json-abi = "1.5.7"
reqwest = { version = "0.13.2", features = ["json"] }
rust_decimal = "1.40.0"
tracing-subscriber = "0.3.23"
tower = { version = "0.5.3", features = ["limit"] }
tower-http = { version = "0.6.8", features = ["cors", "trace", "timeout", "limit"] }
tracing = "0.1.44"
tower_governor = "0.8.0"

